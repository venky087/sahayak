services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: sahayak, POSTGRES_PASSWORD: sahayak, POSTGRES_DB: sahayak }
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    env_file: .env
    ports: ["4000:4000"]
    depends_on: [db]
  web:
    build: ./frontend
    env_file: .env
    ports: ["5173:5173"]
    depends_on: [api]
volumes: { pgdata: {} }
